[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech-return-of-capital"
version = "0.1.0"
description = "Return-of-capital adjustment on exact decimal-string arithmetic, keeping the market-data, investor-return and US tax views separate, with basis-runway and gross-versus-net analysis."
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "The Fintech Builder" }]
keywords = ["fintech", "corporate-actions", "return-of-capital", "cost-basis", "point-in-time", "exact-arithmetic", "market-data"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Article = "https://thefintechbuilder.com/corporate-actions-and-security-master-data/complex-distributions/return-of-capital-adjustment/"
Homepage = "https://github.com/IslamBaraka90/Fintech-Return-Of-Capital-Adjustment-Corporate-Actions-algorithm"
Index = "https://github.com/IslamBaraka90/Fintech-Algorithms-Awesome"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
